<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life@Acuver</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@500;600;700&display=swap">
<style>
/* Layout: section tabs, then year selector, then (Activities only) category chips, then an even photo grid; full-screen viewer. */
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --tile:#E7E9E2; --ink:#141A16; --muted:#5C635E; --line:#DCDFD7;
  --active:#141A16; --on-active:#FFFFFF; --accent:#E8A202;
  --c-activities:#2E6A92; --c-townhalls:#1F7A78; --c-celebrations:#B23A5B; --c-csr:#3F7D2C;
  --ui:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512;--surface:#1A201C;--tile:#222924;--ink:#EEF1EC;--muted:#A3ABA5;--line:#2E3631;
  --active:#EEF1EC;--on-active:#111512;--accent:#F5B82A;
  --c-activities:#6FB0DD;--c-townhalls:#4FC0BC;--c-celebrations:#E77D99;--c-csr:#7FC36A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512;--surface:#1A201C;--tile:#222924;--ink:#EEF1EC;--muted:#A3ABA5;--line:#2E3631;
  --active:#EEF1EC;--on-active:#111512;--accent:#F5B82A;
  --c-activities:#6FB0DD;--c-townhalls:#4FC0BC;--c-celebrations:#E77D99;--c-csr:#7FC36A;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 20px;
  padding:14px max(16px,env(safe-area-inset-left,0px)) 16px}
.bar-in{max-width:1400px;margin:0 auto;display:grid;gap:16px;justify-items:start}
.scroll{max-width:100%;overflow-x:auto;scrollbar-width:none;padding:3px}
.scroll::-webkit-scrollbar{display:none}

/* sections: underline tabs */
.secs{position:relative;display:flex;gap:28px;border-bottom:1px solid var(--line);width:100%}
.secwrap{width:100%}
.sec{position:relative;flex:none;border:0;background:none;cursor:pointer;color:var(--muted);
  font:700 1.35rem var(--ui);padding:8px 2px 12px;transition:color .25s}
.sec:hover{color:var(--ink)}
.sec[aria-selected="true"]{color:var(--ink)}
.sec .n{font-size:.85rem;font-weight:600;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.sec-line{position:absolute;bottom:-1px;left:0;height:3px;border-radius:3px;background:var(--active);
  transition:transform .4s cubic-bezier(.3,1.25,.5,1),width .4s cubic-bezier(.3,1.25,.5,1)}

/* years: segmented pill */
.years{position:relative;display:inline-flex;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.yr{position:relative;z-index:1;flex:none;border:0;background:none;cursor:pointer;color:var(--muted);
  font:700 1.15rem var(--ui);padding:10px 22px;border-radius:999px;font-variant-numeric:tabular-nums;transition:color .25s}
.yr:hover{color:var(--ink)}
.yr[aria-pressed="true"]{color:var(--on-active)}
.yr-pill{position:absolute;z-index:0;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--active);
  transition:transform .4s cubic-bezier(.3,1.25,.5,1),width .4s cubic-bezier(.3,1.25,.5,1)}

/* category chips (Activities) */
.cats{display:flex;gap:10px}
.chip{flex:none;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 1.02rem var(--ui);padding:10px 18px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .n{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--active);color:var(--on-active);border-color:var(--active)}
.chip[aria-pressed="true"] .n{color:color-mix(in srgb,var(--on-active) 65%,transparent)}
.chip.zero:not([aria-pressed="true"]){opacity:.55}
.catwrap{animation:rise .3s both}

/* grid */
.stagewrap{max-width:1400px;margin:0 auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;transition:opacity .22s,transform .22s}
.gallery.out{opacity:0;transform:translateY(8px)}
.gallery.out.l{transform:translateX(-24px)}.gallery.out.r{transform:translateX(24px)}
.gallery button{display:block;width:100%;aspect-ratio:4/3;max-width:100%;margin:0;padding:0;border:0;background:var(--tile);
  border-radius:14px;overflow:hidden;cursor:zoom-in;position:relative;animation:rise .45s both;animation-delay:calc(var(--i) * 40ms)}
.gallery img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .5s ease}
.gallery button:hover img{transform:scale(1.04)}
.gallery .tag{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;
  background:rgba(20,26,22,.72);color:#fff;font:600 .78rem var(--ui);padding:4px 10px 3px;border-radius:999px}
.gallery .tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
@keyframes rise{from{opacity:.001;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

.empty{grid-column:1/-1;max-width:420px;margin:10vh auto;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center;animation:rise .4s both}
.empty .ring{width:76px;height:76px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:1.8rem;color:var(--accent)}
.empty b{color:var(--ink);font-size:1.15rem}

/* viewer */
dialog{border:0;padding:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;background:#0B0E0C;color:#F2F4EF;font-family:var(--ui)}
dialog::backdrop{background:#0B0E0C}
.v{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-variant-numeric:tabular-nums;opacity:.8}
.tools{display:flex;gap:8px}
.ic{background:rgba(242,244,239,.12);color:#F2F4EF;border:0;border-radius:999px;min-width:44px;height:44px;padding:0 14px;font:600 .95rem var(--ui);cursor:pointer;transition:background .2s}
.ic:hover{background:rgba(242,244,239,.24)}
.ic.on{background:#F2F4EF;color:#0B0E0C}
.stage{position:relative;overflow:hidden;min-height:0;margin-top:10px}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .3s ease,opacity .25s;cursor:zoom-in;touch-action:pan-y}
.stage img.zoom{transform:scale(1.9);cursor:zoom-out}
.stage img.fade{opacity:0}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:1.4rem;z-index:1}
.arrow.l{left:4px}.arrow.r{right:4px}
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:thin;justify-content:safe center}
.strip button{flex:none;width:72px;height:54px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;cursor:pointer;opacity:.5;background:#222;transition:.2s}
.strip button[aria-current="true"]{border-color:#F2F4EF;opacity:1}
.strip button:hover{opacity:.9}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:600px){.arrow{display:none}.strip button{width:56px;height:42px}.sec{font-size:1.15rem}.secs{gap:20px}
  .yr{font-size:1rem;padding:9px 16px}.chip{font-size:.95rem;padding:9px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="scroll secwrap"><div class="secs" role="tablist" aria-label="Section" id="secs"><span class="sec-line" id="secLine" aria-hidden="true"></span></div></div>
    <div class="scroll"><div class="years" role="group" aria-label="Year" id="years"><span class="yr-pill" id="yrPill" aria-hidden="true"></span></div></div>
    <div class="scroll catwrap" id="catwrap"><div class="cats" role="group" aria-label="Category" id="cats"></div></div>
  </div>
</div>
<div class="stagewrap"><div class="gallery" id="grid" role="tabpanel" aria-live="polite"></div></div>

<dialog id="lb" aria-label="Photo viewer">
  <div class="v">
    <div class="top">
      <span class="count" id="count"></span>
      <div class="tools">
        <button class="ic" id="play" type="button" aria-pressed="false">▶ Slideshow</button>
        <button class="ic" id="close" type="button" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <img id="big" src="" alt="">
      <button class="ic arrow l" id="prev" type="button" aria-label="Previous photo">←</button>
      <button class="ic arrow r" id="next" type="button" aria-label="Next photo">→</button>
      <div class="progress" id="prog"></div>
    </div>
    <div class="strip" id="strip"></div>
  </div>
</dialog>

<script>
/* Add photos here: file names from images/ and thumbs/, under a section (and category) and year. */
const YEARS = [2026, 2025, 2024, 2023, 2022, 2021, 2020];
const SECTIONS = [
  {id:"awards", name:"Awards", photos:{}},
  {id:"offsite", name:"Offsite", photos:{}},
  {id:"activities", name:"Activities", cats:[
    {id:"activities", name:"Activities", color:"--c-activities", photos:{
      2025:["img_6425","img_6426","img_6427","img_6428","img_6430","img_6431",
            "img_6432","img_6433","img_6436","img_6437","img_6444","img_6528"]}},
    {id:"town-halls", name:"Town Halls", color:"--c-townhalls", photos:{}},
    {id:"celebrations", name:"Celebrations", color:"--c-celebrations", photos:{}},
    {id:"csr", name:"CSR", color:"--c-csr", photos:{}}
  ]}
];
const $ = id => document.getElementById(id);
const secsEl = $("secs"), secLine = $("secLine"), yearsEl = $("years"), yrPill = $("yrPill"),
      catwrap = $("catwrap"), catsEl = $("cats"), grid = $("grid"), lb = $("lb"), big = $("big"), strip = $("strip");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* photo lookups: {f, label, color} */
const catPhotos = (c, y) => (c.photos[y] || []).map(f => ({f, label:c.name, color:c.color}));
const secPhotos = (s, y) => s.cats ? s.cats.flatMap(c => catPhotos(c, y)) : (s.photos[y] || []).map(f => ({f, label:s.name}));
const secTotal = s => YEARS.reduce((a, y) => a + secPhotos(s, y).length, 0);
const latestYear = s => YEARS.find(y => secPhotos(s, y).length) || YEARS[0];
let sec = SECTIONS[0], year = YEARS[0], cat = "all", photos = [], idx = 0, timer = null, swapT = null;

/* sections */
SECTIONS.forEach(s => {
  const b = document.createElement("button");
  b.className = "sec"; b.type = "button"; b.setAttribute("role", "tab"); b.id = "sec-" + s.id; b.dataset.s = s.id;
  b.innerHTML = `${s.name}<span class="n">${secTotal(s)}</span>`;
  b.onclick = () => go(s.id, latestYear(s), "all");
  secsEl.appendChild(b);
});
/* years */
YEARS.forEach(y => {
  const b = document.createElement("button");
  b.className = "yr"; b.type = "button"; b.dataset.y = y; b.textContent = y;
  b.onclick = () => go(sec.id, y, cat);
  yearsEl.appendChild(b);
});
[secsEl, yearsEl, catsEl].forEach(g => g.addEventListener("keydown", e => {
  if (!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const btns = [...g.querySelectorAll("button")], i = btns.indexOf(document.activeElement);
  const nb = btns[i + (e.key === "ArrowRight" ? 1 : -1)]; if (nb) { nb.click(); nb.focus(); }
}));
function moveMarks(){
  const s = $("sec-" + sec.id);
  secLine.style.width = s.offsetWidth + "px"; secLine.style.transform = `translateX(${s.offsetLeft}px)`;
  const y = yearsEl.querySelector(`[data-y="${year}"]`);
  yrPill.style.width = y.offsetWidth + "px"; yrPill.style.transform = `translateX(${y.offsetLeft}px)`;
}
function buildCats(){
  catsEl.innerHTML = "";
  if (!sec.cats) return;
  [{id:"all", name:"All"}, ...sec.cats].forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.c = c.id;
    if (c.color) b.style.setProperty("--c", `var(${c.color})`);
    b.innerHTML = `${c.color ? '<span class="dot"></span>' : ""}${c.name}<span class="n"></span>`;
    b.onclick = () => go(sec.id, year, c.id);
    catsEl.appendChild(b);
  });
}

/* routing: #activities-2025 or #activities-2025-csr */
function go(s, y, c){ location.hash = c && c !== "all" ? `${s}-${y}-${c}` : `${s}-${y}`; }
function parse(){
  const m = location.hash.slice(1).match(/^([a-z]+)-(\d{4})(?:-([a-z-]+))?$/);
  const s = SECTIONS.find(x => m && x.id === m[1]) || SECTIONS.find(x => secTotal(x)) || SECTIONS[0];
  const y = m && YEARS.includes(+m[2]) ? +m[2] : latestYear(s);
  const c = m && s.cats && s.cats.some(k => k.id === m[3]) ? m[3] : "all";
  return [s, y, c];
}
function apply(first){
  const [s, y, c] = parse();
  const secChanged = s !== sec;
  const dir = secChanged ? "" : y < year ? "r" : y > year ? "l" : "";
  sec = s; year = y; cat = c;
  if (first || secChanged) { buildCats(); catwrap.hidden = !sec.cats; catwrap.style.animation = "none"; catwrap.offsetWidth; catwrap.style.animation = ""; }

  secsEl.querySelectorAll(".sec").forEach(b => {
    const on = b.dataset.s === sec.id; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
  });
  yearsEl.querySelectorAll(".yr").forEach(b => {
    const yy = +b.dataset.y, on = yy === year, n = secPhotos(sec, yy).length;
    b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", `${yy}, ${n} photo${n === 1 ? "" : "s"}`);
    if (on) b.scrollIntoView({block:"nearest", inline:"nearest"});
  });
  catsEl.querySelectorAll(".chip").forEach(b => {
    const id = b.dataset.c, n = id === "all" ? secPhotos(sec, year).length : catPhotos(sec.cats.find(k => k.id === id), year).length;
    b.querySelector(".n").textContent = n;
    b.classList.toggle("zero", n === 0);
    b.setAttribute("aria-pressed", id === cat);
    if (id === cat) b.scrollIntoView({block:"nearest", inline:"nearest"});
  });
  grid.setAttribute("aria-labelledby", "sec-" + sec.id);
  moveMarks();
  if (first || reduce) { render(); return; }
  clearTimeout(swapT);
  grid.classList.add("out"); if (dir) grid.classList.add(dir);
  swapT = setTimeout(() => { render(); grid.classList.remove("out","l","r"); }, 220);
}
function label(){
  const c = sec.cats && cat !== "all" ? sec.cats.find(k => k.id === cat) : null;
  return c && c.name !== sec.name ? `${sec.name} · ${c.name}` : sec.name;
}
function render(){
  photos = sec.cats && cat !== "all" ? catPhotos(sec.cats.find(k => k.id === cat), year) : secPhotos(sec, year);
  grid.innerHTML = "";
  if (!photos.length){
    grid.innerHTML = `<div class="empty"><div class="ring">✿</div><b>${label()} ${year}</b><span>Photos coming soon</span></div>`;
    return;
  }
  const showTag = sec.cats && cat === "all";
  photos.forEach((p, n) => {
    const b = document.createElement("button"); b.type = "button"; b.style.setProperty("--i", n);
    if (p.color) b.style.setProperty("--c", `var(${p.color})`);
    b.setAttribute("aria-label", `Open ${p.label} ${year} photo ${n+1}`);
    b.innerHTML = `<img src="thumbs/${p.f}.jpg" alt="${p.label} ${year} photo ${n+1}" loading="lazy">${showTag ? `<span class="tag"><i></i>${p.label}</span>` : ""}`;
    b.onclick = () => open(n);
    grid.appendChild(b);
  });
}
addEventListener("hashchange", () => apply(false));
addEventListener("resize", moveMarks);
document.fonts && document.fonts.ready.then(moveMarks);

/* viewer */
function open(n){
  strip.innerHTML = "";
  photos.forEach((p, i) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `Photo ${i+1}`);
    b.innerHTML = `<img src="thumbs/${p.f}.jpg" alt="">`; b.onclick = () => show(i);
    strip.appendChild(b);
  });
  lb.showModal(); show(n, true);
}
function show(n, instant){
  const N = photos.length; idx = (n + N) % N; const p = photos[idx];
  big.classList.remove("zoom");
  const swap = () => { big.src = `images/${p.f}.jpg`; big.alt = `${p.label} ${year} photo ${idx+1}`; big.onload = () => big.classList.remove("fade"); };
  if (instant) swap(); else { big.classList.add("fade"); setTimeout(swap, 160); }
  $("count").textContent = `${sec.name}${p.label !== sec.name ? " · " + p.label : ""} ${year} · ${idx+1} / ${N}`;
  [...strip.children].forEach((b, i) => b.setAttribute("aria-current", i === idx));
  strip.children[idx] && strip.children[idx].scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  if (timer) restartProgress();
}
function restartProgress(){
  const p = $("prog"); p.style.transition = "none"; p.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = "width 3.5s linear"; p.style.width = "100%"; }));
}
function setPlay(on){
  clearInterval(timer); timer = null;
  const b = $("play"); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
  b.textContent = on ? "❚❚ Pause" : "▶ Slideshow";
  const p = $("prog"); p.style.transition = "none"; p.style.width = "0";
  if (on){ timer = setInterval(() => show(idx+1), 3500); restartProgress(); }
}
$("play").onclick = () => setPlay(!timer);
$("prev").onclick = () => show(idx-1);
$("next").onclick = () => show(idx+1);
$("close").onclick = () => lb.close();
lb.addEventListener("close", () => setPlay(false));
big.onclick = () => big.classList.toggle("zoom");
big.addEventListener("mousemove", e => {
  if (!big.classList.contains("zoom")) return;
  const r = big.getBoundingClientRect();
  big.style.transformOrigin = `${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;
});
$("stage").addEventListener("click", e => { if (e.target.id === "stage") lb.close(); });
document.addEventListener("keydown", e => {
  if (!lb.open) return;
  if (e.key === "ArrowLeft") show(idx-1);
  if (e.key === "ArrowRight") show(idx+1);
  if (e.key === " ") { e.preventDefault(); setPlay(!timer); }
});
let sx = null;
$("stage").addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
$("stage").addEventListener("touchend", e => { if (sx === null) return; const d = e.changedTouches[0].clientX - sx;
  if (Math.abs(d) > 40) show(idx + (d < 0 ? 1 : -1)); sx = null; });

apply(true);
</script>
</body>
</html>
