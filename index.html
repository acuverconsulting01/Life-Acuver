<title>Ganesha 2025 Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#FFFCF4;--tile:#F1EAD9;--focus:#E8A202}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12112A;--tile:#1C1B3A;--focus:#F5B82A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12112A;--tile:#1C1B3A;--focus:#F5B82A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gallery{max-width:1400px;margin:0 auto;columns:3 280px;column-gap:12px}
.gallery button{display:block;width:100%;margin:0 0 12px;padding:0;border:0;background:var(--tile);
  border-radius:10px;overflow:hidden;cursor:zoom-in;break-inside:avoid}
.gallery img{display:block;width:100%;height:auto;transition:transform .4s ease}
.gallery button:hover img{transform:scale(1.04)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh;overflow:visible}
dialog::backdrop{background:rgba(10,9,24,.94)}
dialog img{display:block;max-width:96vw;max-height:88vh;border-radius:8px}
.nav{display:flex;justify-content:center;gap:12px;margin-top:12px}
.nav button,.close{background:#FFF6E0;color:#12112A;border:0;border-radius:999px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
.close{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){.gallery img{transition:none}}
</style>

<div class="gallery" id="grid"></div>

<dialog id="lb" aria-label="Photo viewer">
  <button class="close" id="close" type="button" aria-label="Close">✕</button>
  <img id="big" src="" alt="">
  <div class="nav">
    <button id="prev" type="button" aria-label="Previous photo">←</button>
    <button id="next" type="button" aria-label="Next photo">→</button>
  </div>
</dialog>

<script>
const P = [["img_6425",4],["img_6426",4],["img_6427",3],["img_6428",3],["img_6430",4],["img_6431",4],
           ["img_6432",3],["img_6433",3],["img_6436",4],["img_6437",4],["img_6444",4],["img_6528",4]];
const grid = document.getElementById("grid"), lb = document.getElementById("lb"), big = document.getElementById("big");
let i = 0;
P.forEach(([f,w], n) => {
  const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", `Open photo ${n+1}`);
  b.innerHTML = `<img src="thumbs/${f}.jpg" alt="Photo ${n+1}" loading="lazy" width="${w===4?800:600}" height="${w===4?600:800}">`;
  b.onclick = () => { show(n); lb.showModal(); };
  grid.appendChild(b);
});
function show(n){ i = (n + P.length) % P.length; big.src = `images/${P[i][0]}.jpg`; big.alt = `Photo ${i+1} of ${P.length}`; }
document.getElementById("prev").onclick = () => show(i-1);
document.getElementById("next").onclick = () => show(i+1);
document.getElementById("close").onclick = () => lb.close();
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
document.addEventListener("keydown", e => { if (!lb.open) return;
  if (e.key === "ArrowLeft") show(i-1); if (e.key === "ArrowRight") show(i+1); });
let sx = null;
lb.addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
lb.addEventListener("touchend", e => { if (sx === null) return; const d = e.changedTouches[0].clientX - sx;
  if (Math.abs(d) > 40) show(i + (d < 0 ? 1 : -1)); sx = null; });
</script>
